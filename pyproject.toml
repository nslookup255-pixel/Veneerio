[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnr"
version = "0.3.0.dev0"
description = "A Python-first desktop GUI framework powered by HTML and CSS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hayul Noh" }
]

dependencies = [
    "pywebview>=6.0",
]

[project.scripts]
vnr = "vnr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vnr*"]

[tool.setuptools.package-data]
vnr = ["templates/scaffold/*", "templates/scaffold/.gitignore"]